            <script>
                const raw =
                    "Once upon a time, there was a sweet little girl loved by everyone who met her—but most of all by her grandmother. The old woman adored her so much that she made her a small red velvet hood. It suited her perfectly, and from that day on, everyone called her Little Red Riding Hood. One morning, her mother said, Come, Little Red Riding Hood, here's a piece of cake and a bottle of wine. Take them to your grandmother—she's sick and weak, and this will do her good. Go before it gets too hot, and remember to walk carefully. Don't stray from the path, or you might fall and break the bottle. And when you arrive, don't forget to say good morning before you peek around her room. I'll be careful, Mother, said Little Red Riding Hood, and she promised with a smile. The grandmother lived deep in the forest, about half a league from the village. Just as Little Red Riding Hood entered the woods, a wolf appeared on the path. She didn't know what a wicked creature he was and felt no fear at all. Good morning, Little Red Riding Hood, said the wolf. Good morning, Mr. Wolf, she replied politely. Where are you going so early? he asked. To my grandmother's house, said the girl. And what's that in your basket? Cake and wine. Grandma's been sick, so Mother sent me to cheer her up. And where does your grandmother live? asked the wolf. A little farther into the woods—under the three great oak trees, near the hazel bushes. You must know it, she said. The wolf licked his lips and thought, What a tender young thing! She'll taste even better than the old woman. I'll eat them both—but I'll have to be clever about it. He walked beside her for a bit, then said slyly, Look how pretty the flowers are here, Little Red Riding Hood. Why not pick some for your grandmother? And listen—don't you hear how sweetly the birds are singing? You walk along so seriously, as if you were going to school, when the forest is alive with joy! Little Red Riding Hood looked up and saw sunlight dancing through the trees, making the wildflowers sparkle. Grandma would love a bouquet, she thought. I still have plenty of time. So she stepped off the path to gather flowers. Each time she picked one, she saw another even prettier farther away, and she wandered deeper and deeper into the forest. Meanwhile, the wolf ran straight to the grandmother's house and knocked at the door. Who's there? called the grandmother. It's me—Little Red Riding Hood, said the wolf sweetly. I've brought you cake and wine. Lift the latch, said the grandmother. I'm too weak to get up. The wolf lifted the latch, pushed open the door, and without a word, leapt upon the old woman and swallowed her whole. Then he put on her nightgown and cap, pulled the curtains, and lay down in her bed. When Little Red Riding Hood finally reached the cottage, she was surprised to find the door standing open. The room felt strange and quiet. Oh dear, she whispered, why do I feel so uneasy today? She called out, Good morning, Grandma! but there was no answer. She went to the bed and drew back the curtains. There lay her grandmother, cap pulled low, face shadowed, looking quite odd. Oh, Grandma, what big ears you have! The better to hear you with, my child, came the growling reply. But, Grandma, what big eyes you have! The better to see you with, my dear. And what big hands you have! The better to hug you with. But, Grandma—what a terrible big mouth you have! The better to eat you with! roared the wolf, and before she could scream, he sprang from the bed and swallowed Little Red Riding Hood whole. Full and satisfied, the wolf climbed back into bed and soon began to snore loudly. Just then, a passing huntsman heard the noise and muttered, That old woman snores like a beast! I should check on her. He stepped inside and saw the wolf stretched out in the bed. So it's you, you wicked creature! he said, raising his gun. But then he thought, Maybe the old woman's still inside. So instead of shooting, he took a pair of scissors and carefully cut open the wolf's belly. After two careful snips, he saw a flash of red inside. A few more cuts—and out sprang Little Red Riding Hood, trembling but unharmed. Oh, how frightened I was! It was so dark inside! she cried. Then the huntsman cut a little more, and out came the grandmother, pale but alive. To make sure the wolf could never harm anyone again, they filled his belly with heavy stones. When he awoke and tried to flee, the weight pulled him down, and he fell dead on the spot. The huntsman skinned the wolf and went on his way. The grandmother ate her cake and drank her wine and soon felt much better. As for Little Red Riding Hood, she thought to herself, From now on, I'll never wander from the path again when Mother tells me not to. Some say that later, when she was again walking to her grandmother's with cakes, another wolf tried to tempt her off the path. But this time, Little Red Riding Hood was wiser. She walked straight ahead and told her grandmother about the wicked creature she'd met. They locked the door tight, and when the wolf tried to sneak down the chimney, he fell into a great trough of boiling sausage water—and that was the end of him. And from that day forward, Little Red Riding Hood never strayed from the path, and she lived happily ever after. Once upon a time, there was a sweet little girl loved by everyone who met her—but most of all by her grandmother. The old woman adored her so much that she made her a small red velvet hood. It suited her perfectly, and from that day on, everyone called her Little Red Riding Hood. One morning, her mother said, Come, Little Red Riding Hood, here's a piece of cake and a bottle of wine. Take them to your grandmother—she's sick and weak, and this will do her good. Go before it gets too hot, and remember to walk carefully. Don't stray from the path, or you might fall and break the bottle. And when you arrive, don't forget to say good morning before you peek around her room. I'll be careful, M
